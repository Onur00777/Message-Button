<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bahar Kutlaması</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap');

    :root {
      --ink: #24382c;
      --moss: #3d6844;
      --blush: #e56f90;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
      font-family: Outfit, sans-serif;
      color: var(--ink);
      background: #d7eefe;
      cursor: crosshair;
    }

    .sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 82% 6%, rgba(255, 232, 176, 0.95), transparent 34%),
        linear-gradient(180deg, #8ecbf8 0%, #d4edff 28%, #fff6ea 58%, #e4f5c8 100%);
    }

    .sun {
      position: absolute;
      z-index: 1;
      top: 8vh;
      right: 10vw;
      width: min(200px, 28vw);
      height: min(200px, 28vw);
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0 18%, #ffe7a4 40%, rgba(255, 210, 130, 0) 72%);
    }

    .rays {
      position: absolute;
      z-index: 1;
      width: 88vw;
      height: 88vw;
      right: -16vw;
      top: -30vw;
      pointer-events: none;
      opacity: 0;
      background: repeating-conic-gradient(
        from 206deg at 74% 30%,
        transparent 0deg 10deg,
        rgba(255, 226, 164, 0.22) 10deg 16deg
      );
      -webkit-mask-image: radial-gradient(circle at 74% 30%, #000 0%, transparent 56%);
      mask-image: radial-gradient(circle at 74% 30%, #000 0%, transparent 56%);
    }

    body.celebrate .rays { animation: fadein 2.6s ease 0.3s forwards; }

    .cloud {
      position: absolute;
      z-index: 1;
      height: 42px;
      background: rgba(255, 255, 255, 0.86);
      border-radius: 40px;
    }
    .cloud:before,
    .cloud:after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .c1 { width: 160px; top: 15vh; left: -8vw; animation: drift 90s linear infinite; }
    .c1:before { width: 64px; height: 64px; top: -34px; left: 26px; }
    .c1:after { width: 86px; height: 72px; top: -42px; left: 64px; }
    .c2 { width: 110px; top: 24vh; left: 38vw; opacity: 0.72; animation: drift 120s linear infinite reverse; }
    .c2:before { width: 48px; height: 48px; top: -26px; left: 18px; }
    .c2:after { width: 60px; height: 50px; top: -30px; left: 42px; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(70vw); }
    }

    .hill {
      position: absolute;
      z-index: 1;
      border-radius: 50%;
    }
    .hill.far {
      left: -12%;
      bottom: 8vh;
      width: 62%;
      height: 32vh;
      background: #d9f0c6;
    }
    .hill.mid {
      right: -18%;
      bottom: 5vh;
      width: 74%;
      height: 28vh;
      background: #c6e7ad;
    }
    .hill.near {
      z-index: 2;
      left: -20%;
      bottom: -16vh;
      width: 140%;
      height: 30vh;
      background: linear-gradient(#b6de93, #7fbb62);
    }

    svg.grove {
      position: absolute;
      z-index: 3;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 92%;
      overflow: visible;
      pointer-events: none;
    }

    svg path.stem {
      fill: none;
      stroke: #6a4636;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    body.celebrate svg path.stem { animation: draw 2.7s ease forwards; }
    body.celebrate svg path.b2 { animation-delay: 0.28s; }
    body.celebrate svg path.b3 { animation-delay: 0.5s; }

    @keyframes draw { to { stroke-dashoffset: 0; } }

    .canopy-glow { opacity: 0; }
    body.celebrate .canopy-glow { animation: fadein 1.8s ease 0.7s forwards; }

    .blossoms .floret,
    .leaves ellipse {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(0);
      opacity: 0;
    }

    body.celebrate .blossoms .floret,
    body.celebrate .leaves ellipse {
      animation: pop 0.85s cubic-bezier(0.16, 1.25, 0.32, 1) forwards;
    }

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .grass {
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42px;
      pointer-events: none;
    }

    .blade {
      position: absolute;
      bottom: 0;
      width: 2px;
      border-radius: 2px 2px 0 0;
      transform-origin: bottom center;
      background: linear-gradient(#dff6b4, #4f8d43);
      animation: sway 3.4s ease-in-out infinite;
    }

    .meadow {
      position: absolute;
      z-index: 4;
      inset: 0;
      pointer-events: none;
    }

    .flower {
      position: absolute;
      bottom: var(--b);
      width: 44px;
      height: var(--h);
      transform-origin: 50% 100%;
      transform: scale(var(--s), 0);
    }

    body.celebrate .flower {
      animation: grow 1.05s cubic-bezier(0.16, 0.84, 0.32, 1) forwards;
      animation-delay: var(--d);
    }

    @keyframes grow {
      to { transform: scale(var(--s), var(--s)); }
    }

    .sway {
      position: relative;
      height: 100%;
      transform-origin: 50% 100%;
      animation: sway var(--sway, 3.8s) ease-in-out infinite;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(var(--tilt)); }
      50% { transform: rotate(calc(var(--tilt) * -1)); }
    }

    .stalk {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 3px;
      height: 74%;
      transform: translateX(-50%);
      border-radius: 3px;
      background: linear-gradient(#2f6a3c, #9ed074);
    }

    .leaf {
      position: absolute;
      bottom: 36%;
      width: 15px;
      height: 7px;
      background: #74b85d;
      border-radius: 0 80% 0 80%;
    }
    .leaf.l { left: 6px; transform: rotate(24deg); }
    .leaf.r { right: 6px; transform: rotate(-18deg) scaleX(-1); }

    .head { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }

    .tulip .head {
      width: 20px;
      height: 28px;
      background: linear-gradient(#ffc6d4, #e25580);
      border-radius: 11px 11px 10px 10px;
      box-shadow: inset -4px -6px 0 rgba(150, 30, 60, 0.12);
    }
    .tulip .head:before,
    .tulip .head:after {
      content: '';
      position: absolute;
      top: 8px;
      width: 10px;
      height: 16px;
      background: linear-gradient(#ffd5e0, #e25580);
      border-radius: 10px;
    }
    .tulip .head:before { left: -5px; transform: rotate(-15deg); }
    .tulip .head:after { right: -5px; transform: rotate(15deg); }

    .daisy .head {
      top: 8px;
      width: 14px;
      height: 14px;
      background: #f0c23d;
      border-radius: 50%;
      box-shadow:
        0 -12px 0 4px #fff,
        0 12px 0 4px #fff,
        -12px 0 0 4px #fff,
        12px 0 0 4px #fff,
        8px -8px 0 3px #fff,
        -8px 8px 0 3px #fff,
        8px 8px 0 3px #fff,
        -8px -8px 0 3px #fff;
    }

    .buttercup .head {
      top: 10px;
      width: 12px;
      height: 12px;
      background: #f6b31d;
      border-radius: 50%;
      box-shadow:
        0 -10px 0 4px #ffe566,
        0 10px 0 4px #ffd34a,
        -10px 0 0 4px #ffe566,
        10px 0 0 4px #ffd34a,
        7px -7px 0 3px #fff3b0,
        -7px 7px 0 3px #ffe566,
        7px 7px 0 3px #ffd34a,
        -7px -7px 0 3px #fff3b0;
    }

    .crocus .head {
      width: 14px;
      height: 24px;
      background: linear-gradient(#efe4ff, #9b7ad4);
      border-radius: 10px 10px 7px 7px;
    }
    .crocus .head:before {
      content: '';
      position: absolute;
      left: 6px;
      top: 3px;
      width: 2px;
      height: 14px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 2px;
    }

    .blossom .head {
      top: 6px;
      width: 16px;
      height: 16px;
      background: radial-gradient(circle at 40% 35%, #fff, #ffd0e0 70%);
      border-radius: 50%;
      box-shadow: 9px 1px 0 #ffe8f0, -8px 2px 0 #fff, 0 10px 0 #ffd5e4;
    }

    .wild { width: 28px; z-index: 3; }
    .wild .stalk { width: 2px; opacity: 0.8; }
    .wild .leaf { display: none; }

    canvas#petals {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    .butterflies { position: fixed; inset: 0; z-index: 6; pointer-events: none; }

    .bf {
      position: absolute;
      width: 36px;
      height: 22px;
      offset-rotate: auto;
      animation: travel var(--dur) linear infinite;
      animation-delay: var(--delay);
    }
    .bf.a { offset-path: path('M -40,240 C 220,90 420,280 700,150 S 1080,70 1400,190'); }
    .bf.b { offset-path: path('M 1400,120 C 1040,40 860,260 560,170 S 160,90 -60,210'); }
    .bf.c { offset-path: path('M 80,70 C 320,180 560,40 820,130 S 1180,230 1360,80'); }

    @keyframes travel { to { offset-distance: 100%; } }

    .wing {
      position: absolute;
      top: 1px;
      width: 20px;
      height: 15px;
      border-radius: 80% 70% 40% 60%;
      animation: flap 0.26s ease-in-out infinite alternate;
    }
    .wing.left {
      left: 0;
      background: linear-gradient(#ffe5ee, #f27ca2);
      transform-origin: right center;
    }
    .wing.right {
      left: 16px;
      background: linear-gradient(#fff4c4, #f0b429);
      transform-origin: left center;
    }
    .bf.b .wing.left { background: linear-gradient(#e7f6ff, #7eb6ea); }
    .bf.c .wing.right { background: linear-gradient(#ffe3f0, #e989b0); }
    .bodyline {
      position: absolute;
      left: 16px;
      top: 5px;
      width: 3px;
      height: 10px;
      border-radius: 3px;
      background: #5a3d32;
    }

    @keyframes flap { to { transform: scaleX(0.62); } }

    .message {
      position: absolute;
      z-index: 7;
      left: max(28px, 6vw);
      top: 10vh;
      width: min(460px, 42vw);
      pointer-events: none;
    }

    .message:before {
      content: '';
      position: absolute;
      z-index: -1;
      inset: -40px -40px -20px -24px;
      background: radial-gradient(ellipse at 20% 30%, rgba(255, 255, 255, 0.78), transparent 70%);
      filter: blur(8px);
    }

    .kicker, h1, .lede {
      margin: 0;
      opacity: 0;
      transform: translateY(16px);
      filter: blur(8px);
    }

    body.celebrate .kicker,
    body.celebrate h1,
    body.celebrate .lede { animation: risein 1.1s ease forwards; }
    body.celebrate .kicker { animation-delay: 1.15s; }
    body.celebrate h1 { animation-delay: 1.35s; }
    body.celebrate .lede { animation-delay: 1.75s; }

    @keyframes risein {
      to { opacity: 1; transform: none; filter: none; }
    }

    .kicker {
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--moss);
    }

    h1 {
      margin-top: 8px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: clamp(68px, 7.4vw, 112px);
      line-height: 0.84;
      letter-spacing: -0.03em;
      color: #1c3124;
    }

    h1 em {
      font-style: italic;
      font-weight: 500;
      color: var(--blush);
    }

    .lede {
      margin-top: 18px;
      max-width: 28ch;
      font-weight: 300;
      font-size: 1.15rem;
      line-height: 1.5;
      color: #3a5242;
    }

    .replay {
      position: absolute;
      z-index: 8;
      right: 22px;
      bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.92rem;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(70, 110, 50, 0.12);
    }
    .replay:hover { background: rgba(255, 255, 255, 0.88); }
    .replay:focus-visible { outline: 2px solid var(--moss); outline-offset: 3px; }

    @keyframes fadein { to { opacity: 1; } }

    @media (max-width: 800px) {
      .message {
        top: 4.5vh;
        left: 22px;
        width: min(520px, calc(100vw - 44px));
      }
      h1 { font-size: clamp(60px, 18vw, 88px); }
      .lede { font-size: 1.02rem; max-width: 34ch; }
      .sun { top: 5vh; right: 4vw; width: 110px; height: 110px; }
      svg.grove { height: 76%; }
      .flower { --h: 76px !important; }
      .flower:nth-child(odd) { display: none; }
      .wild { display: none; }
      .hill.near { height: 26vh; bottom: -12vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rays, .canopy-glow { opacity: 0.85; }
      svg path.stem { stroke-dashoffset: 0; animation: none !important; }
      .blossoms .floret,
      .leaves ellipse,
      .flower,
      .kicker, h1, .lede {
        opacity: 1;
        filter: none;
        animation: none !important;
      }
      .blossoms .floret,
      .leaves ellipse { transform: none; }
      .flower { transform: scale(var(--s), var(--s)); }
      .cloud, .blade, .sway, .bf, .wing { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="rays"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="hill far"></div>
    <div class="hill mid"></div>
    <div class="hill near"></div>
  </div>

  <svg class="grove" id="grove" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <defs>
      <radialGradient id="blushGlow" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.35" />
        <stop offset="42%" stop-color="#ffd0e0" stop-opacity="0.55" />
        <stop offset="100%" stop-color="#ffd0e0" stop-opacity="0" />
      </radialGradient>
    </defs>
    <ellipse class="shade" cx="830" cy="768" rx="210" ry="16" fill="rgba(72,110,52,0.16)" />
    <ellipse class="canopy-glow" cx="830" cy="230" rx="250" ry="145" fill="url(#blushGlow)" />

    <g fill="none" stroke-width="8">
      <path class="stem" pathLength="1" d="M830,790 C835,650 800,520 830,400" />
      <path class="stem b2" pathLength="1" stroke-width="4.5" d="M828,455 C740,390 660,320 600,240" />
      <path class="stem b2" pathLength="1" stroke-width="4.5" d="M832,440 C920,380 1000,310 1060,230" />
      <path class="stem b3" pathLength="1" stroke-width="3.2" d="M824,390 C750,320 730,240 700,170" />
      <path class="stem b3" pathLength="1" stroke-width="3.2" d="M836,385 C930,310 990,250 1030,175" />
      <path class="stem b3" pathLength="1" stroke-width="3" d="M818,480 C730,450 660,400 610,340" />
      <path class="stem b3" pathLength="1" stroke-width="2.6" d="M700,250 C660,210 640,180 615,145" />
      <path class="stem b3" pathLength="1" stroke-width="2.6" d="M960,250 C1010,210 1040,180 1065,145" />
      <path class="stem b3" pathLength="1" stroke-width="2.4" d="M830,300 C800,230 840,170 800,120" />
    </g>

    <g class="leaves" id="grove-leaves"></g>
    <g class="blossoms" id="grove-blossoms"></g>
  </svg>

  <div class="meadow" id="meadow"></div>
  <div class="grass" id="grass" aria-hidden="true"></div>
  <canvas id="petals"></canvas>

  <div class="butterflies" aria-hidden="true">
    <div class="bf a" style="--dur:18s; --delay:-6s"><i class="wing left"></i><i class="wing right"></i><i class="bodyline"></i></div>
    <div class="bf b" style="--dur:22s; --delay:-11s"><i class="wing left"></i><i class="wing right"></i><i class="bodyline"></i></div>
    <div class="bf c" style="--dur:16s; --delay:-3s"><i class="wing left"></i><i class="wing right"></i><i class="bodyline"></i></div>
  </div>

  <div class="message">
    <p class="kicker">Bir ilkbahar kutlaması</p>
    <h1>İlkbahar<br><em>seninle.</em></h1>
    <p class="lede">Çiçekler senin için açtı. Bu mevsim yavaş, aydınlık ve senin olsun.</p>
  </div>

  <button class="replay" id="replay" type="button">Yeniden aç</button>

  <script>
    function mulberry32(seed) {
      return function () {
        seed |= 0;
        seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const ns = 'http://www.w3.org/2000/svg';
    const bloomColors = ['#fffdfb', '#fff7f4', '#ffe6ef', '#ffd0e0', '#ffc3d6'];
    const leafColors = ['#93c86e', '#6aaa55', '#c0e294'];

    function addFloret(root, x, y, radius, delay, rand) {
      const holder = document.createElementNS(ns, 'g');
      holder.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + ((rand() * 360) | 0) + ')');
      const floret = document.createElementNS(ns, 'g');
      floret.setAttribute('class', 'floret');
      floret.style.animationDelay = delay.toFixed(2) + 's';
      const fill = bloomColors[(rand() * bloomColors.length) | 0];
      for (let i = 0; i < 5; i++) {
        const petal = document.createElementNS(ns, 'ellipse');
        petal.setAttribute('cx', '0');
        petal.setAttribute('cy', (-radius * 0.46).toFixed(2));
        petal.setAttribute('rx', (radius * 0.4).toFixed(2));
        petal.setAttribute('ry', (radius * 0.58).toFixed(2));
        petal.setAttribute('fill', fill);
        petal.setAttribute('transform', 'rotate(' + (i * 72) + ')');
        floret.appendChild(petal);
      }
      const heart = document.createElementNS(ns, 'circle');
      heart.setAttribute('r', (radius * 0.16).toFixed(2));
      heart.setAttribute('fill', '#f3c14e');
      floret.appendChild(heart);
      holder.appendChild(floret);
      root.appendChild(holder);
    }

    function paintDisk(root, leafRoot, cx, cy, rx, ry, count, delayBase, rand) {
      for (let i = 0; i < count; i++) {
        const angle = rand() * Math.PI * 2;
        const dist = Math.pow(rand(), 0.72);
        const x = cx + Math.cos(angle) * rx * dist;
        const y = cy + Math.sin(angle) * ry * dist;
        addFloret(root, x, y, 6.5 + rand() * 5.5, delayBase + rand() * 0.85, rand);
        if (rand() > 0.82) {
          const leaf = document.createElementNS(ns, 'ellipse');
          leaf.setAttribute('cx', x.toFixed(1));
          leaf.setAttribute('cy', y.toFixed(1));
          leaf.setAttribute('rx', (8 + rand() * 5).toFixed(1));
          leaf.setAttribute('ry', '3.2');
          leaf.setAttribute('fill', leafColors[(rand() * leafColors.length) | 0]);
          leaf.style.animationDelay = (delayBase + rand()).toFixed(2) + 's';
          const wrap = document.createElementNS(ns, 'g');
          wrap.setAttribute('transform', 'rotate(' + ((rand() * 160 - 80) | 0) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')');
          wrap.appendChild(leaf);
          leafRoot.appendChild(wrap);
        }
      }
    }

    const rand = mulberry32(19);
    const blooms = document.getElementById('grove-blossoms');
    const leaves = document.getElementById('grove-leaves');
    paintDisk(blooms, leaves, 830, 225, 175, 102, 72, 0.85, rand);
    paintDisk(blooms, leaves, 630, 235, 42, 32, 10, 1.15, rand);
    paintDisk(blooms, leaves, 1035, 215, 46, 34, 10, 1.2, rand);
    paintDisk(blooms, leaves, 790, 145, 36, 28, 8, 1.25, rand);

    const meadow = document.getElementById('meadow');
    const kinds = ['tulip', 'daisy', 'buttercup', 'crocus', 'blossom', 'daisy', 'tulip', 'buttercup'];
    const spots = [4, 11, 18, 26, 34, 42, 50, 80, 87, 94];
    spots.forEach(function (left, index) {
      const flower = document.createElement('div');
      flower.className = 'flower ' + kinds[index % kinds.length];
      flower.style.left = 'calc(' + left + '% - 22px)';
      flower.style.setProperty('--h', (96 + (index % 4) * 22) + 'px');
      flower.style.setProperty('--d', (1.35 + (index % 6) * 0.08) + 's');
      flower.style.setProperty('--tilt', ((index % 2 === 0 ? -1 : 1) * (2 + (index % 3))) + 'deg');
      flower.style.setProperty('--s', (0.82 + (index % 3) * 0.12).toFixed(2));
      flower.style.setProperty('--b', (2.2 + (index % 3) * 1.1) + 'vh');
      flower.style.setProperty('--sway', (3.1 + (index % 4) * 0.4) + 's');
      flower.innerHTML = '<div class="sway"><div class="stalk"></div><i class="leaf l"></i><i class="leaf r"></i><div class="head"></div></div>';
      meadow.appendChild(flower);
    });

    const wildRand = mulberry32(8);
    for (let i = 0; i < 10; i++) {
      const flower = document.createElement('div');
      const left = wildRand() < 0.5 ? 3 + wildRand() * 42 : 78 + wildRand() * 18;
      flower.className = 'flower wild ' + kinds[i % kinds.length];
      flower.style.left = left + '%';
      flower.style.setProperty('--h', (48 + wildRand() * 26) + 'px');
      flower.style.setProperty('--d', (1.6 + wildRand() * 0.6) + 's');
      flower.style.setProperty('--tilt', ((wildRand() * 8 - 4).toFixed(1)) + 'deg');
      flower.style.setProperty('--s', (0.55 + wildRand() * 0.25).toFixed(2));
      flower.style.setProperty('--b', (8 + wildRand() * 8) + 'vh');
      flower.innerHTML = '<div class="sway"><div class="stalk"></div><div class="head"></div></div>';
      meadow.appendChild(flower);
    }

    const grass = document.getElementById('grass');
    const grassRand = mulberry32(4);
    for (let i = 0; i < 56; i++) {
      const blade = document.createElement('i');
      blade.className = 'blade';
      blade.style.left = ((i + grassRand() * 0.6) / 56) * 100 + '%';
      blade.style.height = (12 + grassRand() * 26) + 'px';
      blade.style.animationDelay = (grassRand() * -3) + 's';
      blade.style.opacity = String(0.4 + grassRand() * 0.5);
      grass.appendChild(blade);
    }

    const canvas = document.getElementById('petals');
    const ctx = canvas.getContext('2d');
    const petalColors = ['#fffdfb', '#ffe4ee', '#ffd0e0', '#fff1cf', '#f8d7e6', '#e5f4c4'];
    let petals = [];
    let width = 0;
    let height = 0;
    let wind = 0.12;
    let windTarget = 0.12;
    let last = 0;
    let canopyBurst = 0;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const grove = document.getElementById('grove');

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * ratio);
      canvas.height = Math.floor(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      grove.setAttribute('viewBox', width < 800 ? '500 30 680 770' : '0 0 1200 800');
    }

    function makePetal(x, y) {
      return {
        x: x,
        y: y,
        size: 7 + Math.random() * 8,
        vy: 18 + Math.random() * 42,
        vx: -12 + Math.random() * 24,
        rot: Math.random() * Math.PI,
        vr: -1.5 + Math.random() * 3,
        sway: 1.1 + Math.random() * 1.8,
        phase: Math.random() * Math.PI * 2,
        color: petalColors[(Math.random() * petalColors.length) | 0],
        alpha: 0.62 + Math.random() * 0.38
      };
    }

    function burst(x, y, count) {
      for (let i = 0; i < count; i++) {
        const petal = makePetal(x + (Math.random() - 0.5) * 80, y + (Math.random() - 0.5) * 30);
        const angle = Math.random() * Math.PI * 2;
        const speed = 30 + Math.random() * 120;
        petal.vx = Math.cos(angle) * speed;
        petal.vy = Math.sin(angle) * speed * 0.4 + 10;
        petals.push(petal);
      }
    }

    function drawPetal(petal) {
      ctx.save();
      ctx.translate(petal.x, petal.y);
      ctx.rotate(petal.rot);
      ctx.globalAlpha = petal.alpha;
      ctx.fillStyle = petal.color;
      ctx.beginPath();
      ctx.moveTo(0, -petal.size);
      ctx.bezierCurveTo(petal.size * 0.9, -petal.size * 0.2, petal.size * 0.7, petal.size * 0.75, 0, petal.size);
      ctx.bezierCurveTo(-petal.size * 0.7, petal.size * 0.75, -petal.size * 0.9, -petal.size * 0.2, 0, -petal.size);
      ctx.fill();
      ctx.restore();
    }

    function tick(now) {
      const dt = Math.min(0.034, (now - last) / 1000 || 0.016);
      last = now;
      wind += (windTarget - wind) * 0.05;
      ctx.clearRect(0, 0, width, height);
      if (canopyBurst && now > canopyBurst) {
        burst(width * 0.66, height * 0.3, 26);
        canopyBurst = 0;
      }
      for (let i = petals.length - 1; i >= 0; i--) {
        const petal = petals[i];
        petal.phase += dt * petal.sway;
        petal.x += (petal.vx + wind * 24 + Math.sin(petal.phase) * 18) * dt;
        petal.y += petal.vy * dt;
        petal.vy = Math.min(petal.vy + 10 * dt, 90);
        petal.vx *= Math.pow(0.35, dt);
        petal.rot += petal.vr * dt;
        if (petal.y > height + 24) {
          petals.splice(i, 1);
          continue;
        }
        drawPetal(petal);
      }
      if (petals.length < 42 && Math.random() < 0.45) {
        petals.push(makePetal(Math.random() * width, -12));
      }
      requestAnimationFrame(tick);
    }

    function begin() {
      document.body.classList.remove('celebrate');
      void document.body.offsetWidth;
      petals = [];
      if (!reduceMotion) {
        for (let i = 0; i < 28; i++) petals.push(makePetal(Math.random() * width, Math.random() * height * 0.35));
        canopyBurst = performance.now() + 1500;
      }
      document.body.classList.add('celebrate');
    }

    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', function (event) {
      windTarget = (event.clientX / Math.max(width, 1) - 0.5) * 1.5;
    });
    document.body.addEventListener('pointerdown', function (event) {
      if (event.target.closest('button')) return;
      burst(event.clientX, event.clientY, 18);
    });

    const replay = document.getElementById('replay');
    replay.addEventListener('pointerdown', function (event) { event.stopPropagation(); });
    replay.addEventListener('click', begin);

    resize();
    begin();
    if (!reduceMotion) requestAnimationFrame(function (now) {
      last = now;
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
