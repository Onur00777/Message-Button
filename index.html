<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kişiye Özel Sürpriz v3.3 (Kriz Operasyonu)</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

    /* Ana sayfa zeminini baştan aşağı renklendirelim */
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b0a2a 0%, #05020a 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 3D perspektifi telefon için daraltıp stabilize ettik */
      perspective: 800px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #camera-flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
    }

    /* Kriz Çözücü #1: Ölçeklendirme Kapsayıcısı */
    .view-wrapper {
      position: relative;
      /* Laptop ölçüleri */
      width: 320px;
      height: 640px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.5s ease-out;
      transform-origin: center center; /* Merkezden ölçekle */
    }

    .scene {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .phone {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateY(180deg); 
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .phone-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 45px;
      border: 4px solid #3a0007;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* --- IPHONE SIRTASI (Renklendirme Krizine Son) --- */
    .phone-back {
      background: linear-gradient(135deg, #e60026 0%, #8a0014 100%);
      box-shadow: 0 25px 50px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotateY(180deg);
    }

    /* Kriz Çözücü #2: Katmanlama (Z-Index) */
    .camera-bump {
      position: absolute;
      top: 25px;
      left: 25px;
      width: 110px;
      height: 110px;
      background: rgba(138, 0, 20, 0.6);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
      z-index: 5; /* Arka plandaki elmalardan öne aldık */
    }

    .lens {
      position: absolute;
      width: 42px;
      height: 42px;
      background: #0a0a0a;
      border-radius: 50%;
      border: 3px solid #333;
    }
    .lens::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      width: 12px;
      height: 12px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
    }
    .lens-1 { top: 10px; left: 10px; }
    .lens-2 { bottom: 10px; right: 10px; }

    .phone-flash-led {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 18px;
      height: 18px;
      background: #fffde0;
      border-radius: 50%;
      border: 2px solid #ccc;
    }

    .apple-logo {
      width: 45px;
      height: 55px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2; /* Kamera bump'ın arkasında kalsın */
    }
    .apple-logo::before {
      content: '';
      position: absolute;
      top: -15px;
      right: -5px;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 100% 0% 100% 0%;
      transform: rotate(-35deg);
    }
    .apple-logo::after {
      content: '';
      position: absolute;
      top: 12px;
      right: -15px;
      width: 25px;
      height: 25px;
      background: linear-gradient(135deg, #e60026 0%, #8a0014 100%);
      background-attachment: fixed;
      border-radius: 50%;
    }

    .iphone-footer-text {
      position: absolute;
      bottom: 45px;
      width: 100%;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 0.55rem;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    /* --- IPHONE EKRANI (Renkli Kasa) --- */
    .phone-front {
      background: linear-gradient(180deg, #ff007f -20%, #4c0099 50%, #000000 100%);
      box-shadow: 0 25px 50px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      transform: rotateY(0deg);
    }

    .dynamic-island {
      width: 110px;
      height: 30px;
      background: black;
      border-radius: 20px;
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
    }

    .lock-dimmer {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 30;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .screen-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 45px;
      opacity: 0;
      transition: opacity 0.5s ease 0.4s;
      z-index: 20;
    }

    .phone.flipped .screen-content {
      opacity: 1;
    }

    .ios-lockscreen-time {
      margin-top: 10px;
      margin-bottom: 25px;
      text-align: center;
      color: rgba(255, 255, 255, 0.95);
      z-index: 40;
      transition: transform 0.6s ease;
    }
    .unlocked .ios-lockscreen-time {
      transform: scale(0.9) translateY(-10px);
      opacity: 0.8;
    }

    .ios-date {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 0;
    }

    .ios-time {
      font-size: 3.8rem;
      font-weight: 300;
      line-height: 1;
      margin: 2px 0 0 0;
      letter-spacing: -1px;
    }

    .face-id-scanner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 80px;
      height: 80px;
      border: 3px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      z-index: 60;
      display: none;
      opacity: 0;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .face-id-scanner.active {
      display: flex;
      animation: popIn 0.3s forwards;
    }
    .scanner-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: #00ffcc;
      box-shadow: 0 0 10px #00ffcc;
      top: 0;
      animation: scan 1.2s ease-in-out infinite alternate;
    }
    .face-icon {
      font-size: 2.5rem;
      opacity: 0.5;
    }
    
    @keyframes scan {
      0% { top: 0; opacity: 1; }
      100% { top: 100%; opacity: 1; }
    }
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .swipe-area {
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100%;
      height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.5s ease 0.8s;
    }
    .phone.flipped .swipe-area {
      opacity: 1;
    }
    .swipe-text {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      animation: pulseText 2s infinite;
    }
    .swipe-bar {
      width: 120px;
      height: 5px;
      background: white;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    .ios-notification {
      width: 100%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 24px;
      padding: 18px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transform: translateY(-50px);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;
      z-index: 40;
    }

    .unlocked .ios-notification {
      transform: translateY(0);
      opacity: 1;
    }

    .noti-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .author-signature {
      color: #00ffcc; 
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
    }
    .message-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 4px 0;
    }
    .message-body {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.4;
      margin: 0;
    }

    .emoji-dock {
      margin-top: auto;
      margin-bottom: 30px;
      display: flex;
      gap: 20px;
      font-size: 2.5rem;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .unlocked .emoji-dock {
      opacity: 1;
    }
    .emoji { animation: bounce 0.6s infinite alternate; }
    .emoji:nth-child(2) { animation-delay: 0.15s; }
    .emoji-dock .emoji:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    .floating-heart {
      position: fixed;
      font-size: var(--size);
      pointer-events: none;
      z-index: 1000;
      animation: floatUp var(--duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    @keyframes floatUp {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--x-move)), calc(-50% - 150px)) scale(1.2); opacity: 0; }
    }

    .hint-text {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .phone.flipped + .hint-text { opacity: 0; }
  </style>
</head>
<body>

  <div id="camera-flash"></div>

  <div class="view-wrapper" id="view-wrapper">
    <div class="scene">
      <div class="phone" id="iphone" onclick="handlePhoneClick(event)">
        
        <div class="phone-face phone-back" id="phone-back">
          <div class="camera-bump">
            <div class="lens lens-1"></div>
            <div class="lens lens-2"></div>
            <div class="phone-flash-led"></div>
          </div>
          <div class="apple-logo"></div>
          <div class="iphone-footer-text">Designed by Onur in California</div>
        </div>

        <div class="phone-face phone-front" id="phone-front">
          <div class="dynamic-island"></div>
          <div class="lock-dimmer" id="dimmer"></div>
          
          <div class="face-id-scanner" id="face-id">
            <div class="scanner-line" id="scanner-line"></div>
            <div class="face-icon" id="lock-icon">🔒</div>
          </div>

          <div class="screen-content">
            <div class="ios-lockscreen-time">
              <p class="ios-date" id="live-date">24 MAYIS PAZAR</p>
              <h1 class="ios-time" id="live-time">15:40</h1>
            </div>

            <div class="ios-notification" id="notification">
              <div class="noti-header">
                <span class="author-signature">Onur Yüksek 💪</span>
                <span>şimdi</span>
              </div>
              <h2 class="message-title">İyi Ki Doğdun! 🎉</h2>
              <p class="message-body">Yeni yaşında her şey gönlünce olsun, tüm güzellikler seni bulsun!</p>
            </div>
            
            <div class="emoji-dock">
              <span class="emoji">🥳</span>
              <span class="emoji">🥰</span>
              <span class="emoji">😎</span>
            </div>
          </div>

          <div class="swipe-area" id="swipe-area">
            <div class="swipe-text">Açmak için yukarı kaydır</div>
            <div class="swipe-bar"></div>
          </div>

        </div>
      </div>
      <div class="hint-text" id="hint">Fotoğraf çekilmek için telefona tıkla! 📸</div>
    </div>
  </div>

  <script>
    let isFlipped = false;
    let isUnlocked = false;
    let isUnlocking = false;

    // Kriz Çözücü #1: Dinamik Responsive Ölçeklendirme
    function adjustScale() {
      const wrapper = document.getElementById('view-wrapper');
      // Laptop ölçüleri (baz alacağımız ölçü)
      const designWidth = 320;
      const designHeight = 640;
      // Anlık ekran (viewport) ölçüleri
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      // Hem genişlik hem de yükseklik için gereken ölçeği hesapla
      const scaleX = screenWidth / designWidth;
      const scaleY = screenHeight / designHeight;

      // Hangi oran daha küçükse (yani hangisi daha çok sığmaya muhtaçsa) onu kullan.
      // Ayrıca laptopta gereksiz büyümemesi için 1.15 gibi bir tavan koy.
      let scale = Math.min(scaleX, scaleY, 1.15); 
      
      // Mobilde çok küçük kalmaması için bir taban (Örn: %80) koy.
      // Sürükleme çizgisi sorunu için buradan biraz pay bırakıyoruz (0.95).
      if (screenWidth < 600) {
        scale = Math.max(0.8, scale * 0.95);
      }

      // CSS Transform ile tüm kapsayıcıyı ölçekle
      wrapper.style.transform = `scale(${scale})`;
    }

    // Saati ve tarihi gerçek zamanlı güncelle
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('live-time').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      const dateText = now.toLocaleDateString('tr-TR', options).toUpperCase();
      document.getElementById('live-date').textContent = dateText;
    }

    // Tıklama işleyicisi
    function handlePhoneClick(event) {
      if (!isFlipped) {
        triggerFlip();
      } else if (isUnlocked) {
        createSparks(event);
      }
    }

    function triggerFlip() {
      if (isFlipped) return;
      isFlipped = true;
      
      const phone = document.getElementById('iphone');
      const flash = document.getElementById('camera-flash');

      setTimeout(() => {
        flash.style.opacity = '1';
        
        setTimeout(() => {
          flash.style.opacity = '0';
          flash.style.transition = 'opacity 0.4s ease';
          
          phone.classList.add('flipped');
          phone.style.transform = 'rotateY(0deg)';
          document.body.style.background = 'radial-gradient(circle at center, #230f38 0%, #05020a 100%)';
        }, 50);
      }, 200);
    }

    // Kaydırma algılaması (Swipe)
    const frontFace = document.getElementById('phone-front');
    let startY = 0;

    frontFace.addEventListener('mousedown', (e) => { startY = e.clientY; });
    frontFace.addEventListener('mouseup', (e) => { handleSwipe(e.clientY); });
    
    frontFace.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; });
    frontFace.addEventListener('touchend', (e) => { handleSwipe(e.changedTouches[0].clientY); });

    function handleSwipe(endY) {
      if (!isFlipped || isUnlocked || isUnlocking) return;
      const swipeDistance = startY - endY;
      if (swipeDistance > 40) {
        processFaceID();
      }
    }

    function processFaceID() {
      isUnlocking = true;
      const faceID = document.getElementById('face-id');
      const swipeArea = document.getElementById('swipe-area');
      const lockIcon = document.getElementById('lock-icon');
      const scannerLine = document.getElementById('scanner-line');
      const dimmer = document.getElementById('dimmer');
      const front = document.getElementById('phone-front');

      swipeArea.style.opacity = '0';
      faceID.classList.add('active');

      setTimeout(() => {
        scannerLine.style.display = 'none';
        lockIcon.textContent = '🔓';
        lockIcon.style.opacity = '1';
        
        setTimeout(() => {
          faceID.classList.remove('active');
          dimmer.style.opacity = '0';
          
          front.classList.add('unlocked');
          isUnlocked = true;

          triggerOpeningConfetti();
        }, 500);
      }, 1200);
    }

    function triggerOpeningConfetti() {
      confetti({
        particleCount: 180,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#ff007f', '#a855f7', '#ffffff', '#00ffcc']
      });
    }

    function createSparks(e) {
      confetti({
        particleCount: 15,
        spread: 60,
        origin: {
          x: e.clientX / window.innerWidth,
          y: e.clientY / window.innerHeight
        },
        colors: ['#ff007f', '#00ffcc', '#ffea00']
      });

      const heartCount = 4;
      const hearts = ['❤️', '💖', '💝', '💕'];

      for (let i = 0; i < heartCount; i++) {
        const heart = document.createElement('div');
        heart.classList.add('floating-heart');
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';

        const xMove = (Math.random() * 160 - 80) + 'px';
        const duration = (Math.random() * 0.6 + 0.6) + 's';
        const size = (Math.random() * 1 + 1.2) + 'rem';

        heart.style.setProperty('--x-move', xMove);
        heart.style.setProperty('--duration', duration);
        heart.style.setProperty('--size', size);

        document.body.appendChild(heart);

        setTimeout(() => { heart.remove(); }, parseFloat(duration) * 1000);
      }
    }

    // --- Başlangıç Operasyonları ---
    // Saati ve tarihi anlık başlat
    updateClock();
    setInterval(updateClock, 1000);

    // Kriz Çözücü #1: Ölçeklendirmeyi anlık başlat ve her ekran değişiminde yenile
    adjustScale();
    window.addEventListener('resize', adjustScale);
    // Bazı mobil tarayıcılar için oryantasyon değişimini de yakala
    window.addEventListener('orientationchange', () => {
      setTimeout(adjustScale, 100); // Küçük bir gecikme stabiliteyi artırır
    });
  </script>
</body>
</html>
